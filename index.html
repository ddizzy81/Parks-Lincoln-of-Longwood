<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parks Lincoln of Longwood — Inventory Tracker</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --gold: #d4af37;
      --text: #c9d1d9;
      --text-muted: #8b949e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    h1 { color: #fff; margin: 0 0 0.5rem 0; font-size: 1.8rem; }
    .updated-tag { color: var(--gold); font-size: 0.9rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    button.filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    button.filter-btn.active, button.filter-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      background: #21262d;
      color: var(--gold);
      width: fit-content;
    }
    .title { color: #fff; font-size: 1.1rem; margin: 0 0 0.5rem 0; }
    .price { font-size: 1.25rem; font-weight: bold; color: #fff; margin: 0.5rem 0; }
    .vin { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Parks Lincoln of Longwood — Inventory Tracker</h1>
    <span class="updated-tag">Last Synced: October 12, 2026 at 02:50 PM</span>
  </header>

  <div class="filters" id="filter-bar">
    <button class="filter-btn active" onclick="applyFilter('all')">All Models</button>
    <button class="filter-btn" onclick="applyFilter('Navigator')">Navigator</button>
    <button class="filter-btn" onclick="applyFilter('Aviator')">Aviator</button>
    <button class="filter-btn" onclick="applyFilter('Nautilus')">Nautilus</button>
    <button class="filter-btn" onclick="applyFilter('Corsair')">Corsair</button>
    <button class="filter-btn" onclick="applyFilter('New')">New Only</button>
    <button class="filter-btn" onclick="applyFilter('Pre-Owned')">Pre-Owned Only</button>
  </div>

  <div class="grid" id="inventory-grid"></div>

  <script>
    const inventory = [];

    function render(items) {
      const grid = document.getElementById("inventory-grid");
      grid.innerHTML = items.map(car => `
        <div class="card">
          <div>
            <div class="badge">${car.category} &bull; ${car.model}</div>
            <h3 class="title">${car.title}</h3>
          </div>
          <div>
            <div class="price">${car.price}</div>
            <div class="vin">VIN: ${car.vin}</div>
          </div>
        </div>
      `).join("");
    }

    function applyFilter(key) {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.toLowerCase().includes(key.toLowerCase()));
      });

      if (key === 'all') {
        render(inventory);
      } else if (key === 'New' || key === 'Pre-Owned') {
        render(inventory.filter(i => i.category === key));
      } else {
        render(inventory.filter(i => i.model === key));
      }
    }

    render(inventory);
  </script>
</body>
</html>
